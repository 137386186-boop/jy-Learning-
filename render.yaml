services:
  - type: web
    name: academic-content-platform-api
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npx prisma db push && npm run start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: "REPLACE_WITH_DATABASE_URL"
      - key: DIRECT_URL
        value: "REPLACE_WITH_DIRECT_URL"
      - key: JWT_SECRET
        value: "REPLACE_WITH_RANDOM_SECRET"
      - key: ADMIN_TOKEN_TTL
        value: "7d"
      - key: ADMIN_PASSWORD
        value: "REPLACE_WITH_ADMIN_PASSWORD"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_FORCE_RESET
        value: "false"
      - key: CORS_ORIGIN
        value: "https://jylearning.com,https://www.jylearning.com"
      - key: FRONTEND_ORIGIN
        value: "https://jylearning.com"
      - key: ZHIHU_CLIENT_ID
        value: ""
      - key: ZHIHU_CLIENT_SECRET
        value: ""
      - key: REDIS_URL
        value: "REPLACE_WITH_REDIS_URL"
      - key: CONTACT_COOLDOWN_SEC
        value: "86400"
      - key: BILI_QQ
        value: ""
      - key: BILI_WECHAT
        value: ""
      - key: BILIBILI_COOKIE
        value: ""
      - key: BILI_SEND_ENABLED
        value: "1"
      - key: BILI_SEND_MODE
        value: "browser"
      - key: BILI_BROWSER_REUSE
        value: "1"
      - key: BILI_BROWSER_TIMEOUT_MS
        value: "15000"
      - key: BILI_SEND_CONFIRM_TTL_SEC
        value: "300"

  - type: cron
    name: academic-content-platform-sync
    env: node
    plan: starter
    rootDir: backend
    schedule: "0 12 * * *"
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run sync:run:prod
    envVars:
      - key: DATABASE_URL
        value: "REPLACE_WITH_DATABASE_URL"
      - key: DIRECT_URL
        value: "REPLACE_WITH_DIRECT_URL"
      - key: JWT_SECRET
        value: "REPLACE_WITH_RANDOM_SECRET"
      - key: CORS_ORIGIN
        value: "https://jylearning.com,https://www.jylearning.com"
      - key: FRONTEND_ORIGIN
        value: "https://jylearning.com"
      - key: ZHIHU_CLIENT_ID
        value: ""
      - key: ZHIHU_CLIENT_SECRET
        value: ""
      - key: SYNC_PLATFORMS
        value: "bilibili,zhihu"
      - key: SYNC_KEYWORDS
        value: "SCI,论文,专利,投稿,发表论文,发表期刊"
      - key: ADMIN_TOKEN_TTL
        value: "7d"
      - key: SYNC_PER_KEYWORD
        value: "40"
      - key: SYNC_INPUT_JSON
        value: "../tools/collector/output.json"
